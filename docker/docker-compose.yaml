version: '3.8'

services:
  spark-master:
    image: bitnami/spark:3.5
    container_name: hsm-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master port
      - "4040:4040"   # Spark Application UI
    volumes:
      - ../data:/data
      - ../configs:/configs
      - ../hsm_pyspark:/app/hsm_pyspark
      - ../scripts:/app/scripts
      - ../benchmarks:/app/benchmarks
    networks:
      - hsm-network

  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: hsm-spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    depends_on:
      - spark-master
    volumes:
      - ../data:/data
      - ../configs:/configs
    networks:
      - hsm-network

  spark-worker-2:
    image: bitnami/spark:3.5
    container_name: hsm-spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    depends_on:
      - spark-master
    volumes:
      - ../data:/data
      - ../configs:/configs
    networks:
      - hsm-network

  minio:
    image: minio/minio:latest
    container_name: hsm-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - hsm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  hsm-network:
    driver: bridge

volumes:
  minio-data:
