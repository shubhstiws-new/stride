[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride"
version = "0.1.0"
description = "Hierarchical session detection for sensor time series on PySpark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shub T" }
]
keywords = ["pyspark", "state-machine", "event-detection", "iot", "timeseries"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyspark>=3.5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "chispa>=0.9",  # Spark DataFrame testing
    "ruff>=0.1",
    "mypy>=1.0",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
benchmark = [
    "pandas>=2.0",
    "polars>=0.20",
    "duckdb>=0.10",
    "dask[dataframe]>=2024.1",
    "pyarrow>=14.0",
    "psutil>=5.9",
    "tabulate>=0.9",
    "matplotlib>=3.7",
    "huggingface_hub>=0.20",
    "datasets>=2.18",
    "paramiko>=3.0",
    "pynvml>=11.0",
    "boto3>=1.34",
    "s3fs>=2024.1",
    "apache-airflow-providers-cncf-kubernetes>=8.0",
    "kubernetes>=28.0",
]

[project.urls]
Homepage = "https://github.com/shubhstiws-new/stride"
Documentation = "https://github.com/shubhstiws-new/stride#readme"
Repository = "https://github.com/shubhstiws-new/stride"

[tool.hatch.build.targets.wheel]
packages = ["hsm_pyspark"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
