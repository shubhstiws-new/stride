[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hsm-pyspark"
version = "0.1.0"
description = "Hierarchical State Machine for Event Detection in PySpark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "HSM-PySpark Contributors" }
]
keywords = ["pyspark", "state-machine", "event-detection", "iot", "timeseries"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyspark>=3.5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "chispa>=0.9",  # Spark DataFrame testing
    "ruff>=0.1",
    "mypy>=1.0",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.urls]
Homepage = "https://github.com/your-org/hsm-pyspark"
Documentation = "https://github.com/your-org/hsm-pyspark#readme"
Repository = "https://github.com/your-org/hsm-pyspark"

[tool.hatch.build.targets.wheel]
packages = ["hsm_pyspark"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
